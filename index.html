<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>try{var t=localStorage.getItem('pp-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <title>Peter Pollak — Catálogo de obra</title>
  <meta name="description" content="Catálogo de obra del pintor Peter Pollak (Chile, 1971–2026): marinas, paisajes, figura, escenas y dibujos. Más de 270 pinturas y dibujos del natural." />
  <link rel="canonical" href="https://peterpollak-cl.vercel.app/" />
  <meta name="theme-color" content="#12100e" />

  <!-- Favicon -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Open Graph (al compartir el link) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Peter Pollak" />
  <meta property="og:locale" content="es_CL" />
  <meta property="og:url" content="https://peterpollak-cl.vercel.app/" />
  <meta property="og:title" content="Peter Pollak — Catálogo de obra" />
  <meta property="og:description" content="Marinas, paisajes, figura, escenas y dibujos del pintor Peter Pollak. Más de 270 obras, 1971–2026." />
  <meta property="og:image" content="https://peterpollak-cl.vercel.app/assets/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Pintura de Peter Pollak — Torres del Paine" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Peter Pollak — Catálogo de obra" />
  <meta name="twitter:description" content="Marinas, paisajes, figura, escenas y dibujos del pintor Peter Pollak. Más de 270 obras, 1971–2026." />
  <meta name="twitter:image" content="https://peterpollak-cl.vercel.app/assets/og-image.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Barra superior + mega menú -->
  <header class="site-header" id="siteHeader">
    <div class="topbar" id="topbar">
      <a href="#/" class="brand">
        <span class="brand-name">Peter Pollak</span>
        <span class="brand-sub">Pintura</span>
      </a>
      <div class="topbar-right">
        <nav class="mainnav" id="mainnav"></nav>
        <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema" title="Cambiar tema"></button>
        <button class="menu-toggle" id="menuToggle" aria-label="Menú">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
    <div class="mega" id="mega" aria-hidden="true"></div>
  </header>

  <!-- Etiqueta que sigue al cursor sobre las obras -->
  <div class="cursor-label" id="cursorLabel" aria-hidden="true">Ver</div>

  <!-- Barra de progreso de scroll -->
  <div class="scroll-progress" id="scrollProgress"></div>

  <!-- Contenido dinámico (home / categoría / obra) -->
  <main id="app"></main>

  <!-- Footer -->
  <footer class="footer" id="footer"></footer>

  <!-- Lightbox / visor de imágenes -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" id="lightboxClose" aria-label="Cerrar">&times;</button>
    <button class="lightbox-nav prev" id="lightboxPrev" aria-label="Anterior">&#8249;</button>
    <div class="lightbox-stage" id="lightboxStage"></div>
    <button class="lightbox-nav next" id="lightboxNext" aria-label="Siguiente">&#8250;</button>
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
